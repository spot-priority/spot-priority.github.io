<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOT Engine - Browser Test Runner</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .test-container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .test-header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: #0f172a;
        }
        .test-summary {
            font-size: 1rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
        }
        .test-summary.pass { background: #dcfce7; color: #15803d; }
        .test-summary.fail { background: #fee2e2; color: #b91c1c; }
        .test-item {
            padding: 12px 16px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f8fafc;
            border-left: 4px solid #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-item.pass {
            border-left-color: #10b981;
            background: #f0fdf4;
        }
        .test-item.fail {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .test-name {
            font-weight: 500;
            color: #1e293b;
        }
        .test-status {
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .test-status.pass { color: #16a34a; }
        .test-status.fail { color: #dc2626; }
        .test-error {
            margin-top: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #b91c1c;
            white-space: pre-wrap;
        }
        .run-btn {
            background: #0f766e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .run-btn:hover {
            background: #115e59;
        }
    </style>
</head>
<body style="background-color: #f1f5f9; padding: 20px;">
    <div class="test-container">
        <div class="test-header">
            <div>
                <h1>🧪 SPOT Engine Test Suite</h1>
                <p style="color: #64748b; margin: 4px 0 0 0;">Browser Validation for SPOT State Machine, Scenarios & Engines</p>
            </div>
            <div>
                <button id="runTestsBtn" class="run-btn">Re-run Tests</button>
            </div>
        </div>

        <div id="summaryBadge" class="test-summary pass" style="display: none; margin-bottom: 20px;">
            Running tests...
        </div>

        <div id="testResultsList"></div>
    </div>

    <script type="module">
        import { TriageEngine } from '../tool/modules/TriageEngine.js';
        import { SCENARIOS } from '../tool/modules/Scenarios.js';
        import { WalkthroughEngine } from '../tool/modules/WalkthroughEngine.js';
        import { QuizEngine } from '../tool/modules/QuizEngine.js';

        const tests = [
            {
                name: 'TriageEngine: Initializes and loads tasks properly',
                fn: () => {
                    const engine = new TriageEngine([
                        { title: 'A1', severity: 'sev-1' },
                        { title: 'A2', severity: 'sev-3' }
                    ]);
                    if (engine.getAllTasks().length !== 2) throw new Error('Task count mismatch');
                    if (engine.currentStep !== 'survey') throw new Error('Initial step must be survey');
                }
            },
            {
                name: 'TriageEngine: Navigation through SPOT stages',
                fn: () => {
                    const engine = new TriageEngine();
                    engine.nextStep(); // prioritize
                    if (engine.currentStep !== 'prioritize') throw new Error('Expected prioritize');
                    engine.nextStep(); // optimize
                    if (engine.currentStep !== 'optimize') throw new Error('Expected optimize');
                    engine.nextStep(); // action
                    if (engine.currentStep !== 'action') throw new Error('Expected action');
                    if (engine.nextStep() !== false) throw new Error('Should not advance beyond action');
                }
            },
            {
                name: 'TriageEngine: Grouping and Action Plan Markdown generation',
                fn: () => {
                    const engine = new TriageEngine([
                        { id: 't1', title: 'Critical Auth Down', severity: 'sev-1' },
                        { id: 't2', title: 'Background Sync', severity: 'sev-3' }
                    ]);
                    engine.setSurveyGroup('t1', 'primary');
                    engine.setSurveyGroup('t2', 'secondary');
                    engine.setUrgencyGroup('t1', 'high_urgency');
                    engine.setImpactGroup('t1', 'high_impact');
                    engine.setActionStatus('t1', 'action_now', 'Rollback v2.14');

                    const plan = engine.generateActionPlan();
                    if (!plan.includes('IMMEDIATE ACTIONS') || !plan.includes('Critical Auth Down')) {
                        throw new Error('Action plan does not contain immediate action details');
                    }
                }
            },
            {
                name: 'SCENARIOS: Validates 4 scenarios including 6-alert & 8-alert cascades',
                fn: () => {
                    if (SCENARIOS.length < 4) throw new Error('Expected at least 4 scenarios');
                    const s2 = SCENARIOS.find(s => s.id === 'scenario-2-cascading-db-deadlock');
                    if (!s2 || s2.tasks.length !== 6) throw new Error('Scenario 2 must have 6 alerts');
                    const s3 = SCENARIOS.find(s => s.id === 'scenario-3-black-friday-collapse');
                    if (!s3 || s3.tasks.length !== 8) throw new Error('Scenario 3 must have 8 alerts');
                }
            },
            {
                name: 'WalkthroughEngine: Steps through all 4 stages across all scenarios',
                fn: () => {
                    const triage = new TriageEngine();
                    const walkthrough = new WalkthroughEngine(triage);
                    SCENARIOS.forEach(scenario => {
                        walkthrough.loadScenario(scenario.id);
                        walkthrough.nextStep();
                        walkthrough.nextStep();
                        walkthrough.nextStep();
                        if (walkthrough.stepIndex !== 3) throw new Error('Walkthrough failed to reach action step');
                    });
                }
            },
            {
                name: 'QuizEngine: Verifies answer evaluation and scoring logic',
                fn: () => {
                    const triage = new TriageEngine();
                    const quiz = new QuizEngine(triage);
                    quiz.loadScenario('scenario-1-auth-outage');
                    const s1 = quiz.submitSurvey(['s1-t1'], ['s1-t2', 's1-t3', 's1-t4']);
                    if (!s1.isCorrect) throw new Error('Survey should be evaluated as correct');
                    const s2 = quiz.submitPrioritize(['s1-t1']);
                    if (!s2.isCorrect) throw new Error('Prioritize should be evaluated as correct');
                    const s3 = quiz.submitOptimize('opt-1');
                    if (!s3.isCorrect) throw new Error('Optimize should be evaluated as correct');
                    const s4 = quiz.submitAction('act-1');
                    if (!s4.isCorrect) throw new Error('Action should be evaluated as correct');
                    if (quiz.score !== 100) throw new Error('Final score should be 100%');
                }
            }
        ];

        function runAllTests() {
            const list = document.getElementById('testResultsList');
            const badge = document.getElementById('summaryBadge');
            list.innerHTML = '';
            let passed = 0;

            tests.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = 'test-item';
                try {
                    t.fn();
                    passed++;
                    item.className += ' pass';
                    item.innerHTML = `
                        <div class="test-name">#${i+1} ${t.name}</div>
                        <div class="test-status pass">PASSED ✓</div>
                    `;
                } catch (err) {
                    item.className += ' fail';
                    item.innerHTML = `
                        <div>
                            <div class="test-name">#${i+1} ${t.name}</div>
                            <div class="test-error">${err.message}\n${err.stack || ''}</div>
                        </div>
                        <div class="test-status fail">FAILED ✗</div>
                    `;
                }
                list.appendChild(item);
            });

            badge.style.display = 'inline-block';
            if (passed === tests.length) {
                badge.className = 'test-summary pass';
                badge.textContent = `All ${passed}/${tests.length} tests passed successfully!`;
            } else {
                badge.className = 'test-summary fail';
                badge.textContent = `${tests.length - passed} failed out of ${tests.length} tests`;
            }
        }

        document.getElementById('runTestsBtn').addEventListener('click', runAllTests);
        runAllTests();
    </script>
</body>
</html>
